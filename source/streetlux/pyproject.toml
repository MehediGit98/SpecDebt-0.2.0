[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streetlux"
version = "0.2.0"
description = "Melanopic exposure along urban routes, for design review (lx melanopic EDI, CIE S 026)"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[project.scripts]
streetlux = "streetlux.__main__:main"

[tool.setuptools.packages.find]
include = ["streetlux*"]
